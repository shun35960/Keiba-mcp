# keiba-mcp 固定設定
# ここの値は MCP ツールからは読み取りも変更もできない。変更は人間がこのファイルを直接編集する。

[guard]
# 1レースあたりの上限額（円）
per_race_limit = 500
# 1週間（火曜〜翌月曜。土日と祝日の月曜開催を同じ週に含める）あたりの上限額（円）
weekly_limit = 1000
# 損失（投票額合計 − 払戻合計。未確定の投票は全額損失とみなす）がこの額に達したら自動停止（円）
# 一度停止すると、人間が補充（uv run admin.py resume）するまで全ての投票を拒否する
# 補充すると、その時点の損失を基準にして、以後の損失をこの額と比べる
loss_stop_threshold = 3000
# 投票金額の単位（円）
bet_unit = 100
# 投票を許可するレース番号（11 = メインレース）。空にすると全レース許可
allowed_race_numbers = [11]

[data]
# データ取得元: "jra"（JRA 公式サイト）または "dummy"（ダミーデータ）
source = "jra"

[data.jra]
# リクエストの最小間隔（秒）。取得元に負荷をかけないため 1 秒未満は不可
request_interval_sec = 3
# 取得したページのキャッシュ（config.toml からの相対パス）
cache_path = "cache.sqlite"
user_agent = "keiba-mcp (personal use)"

[data.dummy]
# false: 実データと同じく、発走10分後まで結果は未確定（発走前に結果を見てから投票することはできない）
# true: 発走前でも結果を返す（動作確認用。結果を見てから投票できてしまうので通常は使わない）
instant_results = false

[voter]
# 投票方式: "dry_run"（記録だけ。実際には買わない）または "browser"（即PAT で実際に購入する）
# 実際に購入するのは、人間がここを "browser" に書き換えたときだけ
mode = "dry_run"

[voter.browser]
# 最後の「OK」（購入確定）を誰が押すか:
#   "manual"   人間がブラウザで押す（既定）
#   "auto"     プログラムが押す
#   "external" 二段階。place_bet は確認画面で止めて保留にし、MCP クライアント側で人間の承認が取れてから
#              confirm_vote で確定する（取り消しは cancel_vote）。画面の無い VM 上のエージェント向け
#              ※ 承認の確認はクライアント（エージェント）の運用で行う。プログラムでは強制できない
confirm = "manual"
# external のときの保留の有効期限（秒）。過ぎると自動で取り消す（締切が先に来る場合は締切まで）
external_confirm_timeout_sec = 300
# 人間が OK を押すのを待つ時間（秒）。過ぎたらキャンセルする
manual_confirm_timeout_sec = 180
# 使うブラウザ: "chrome"（インストール済みの Google Chrome）または ""（Playwright の Chromium）
browser_channel = "chrome"
# 画面を表示せずに動かすか（manual のときは false 固定）
headless = false
# プロキシ（例: "http://host:3128"）。空なら環境変数 HTTPS_PROXY / https_proxy を使う
# ユーザー名・パスワードはここに書かない。環境変数 KEIBA_PROXY_USERNAME / KEIBA_PROXY_PASSWORD
# （または HTTPS_PROXY の URL）で渡す
proxy_server = ""
# TLS を中継するプロキシの CA 証明書（PEM）。プロキシの CA だけを入れたファイルを指定する（最大5個）
# Chromium にはこの CA の公開鍵の指紋だけを信頼させる
tls_ca_file = ""
# 証明書の検証を全面的に無効にする（非推奨。どうしても必要なときだけ）
ignore_https_errors = false
# 失敗時・完了時の画面（加工済み）の保存先。config.toml からの相対パス
debug_dir = "captures/voter"

[credentials]
# ネット投票の認証情報の取得元: "bitwarden"（Bitwarden Secrets Manager）または "env"（環境変数 KEIBA_INET_ID など）
# 認証情報の値そのものは、このファイルにも、リポジトリのどこにも書かない
provider = "bitwarden"

[credentials.bitwarden]
# bws のアクセストークンを保存した macOS キーチェーンの項目
keychain_service = "keiba-mcp"
keychain_account = "bws-access-token"
# bws コマンドのパス（通常は "bws" のままでよい）
bws_path = "bws"
# アクセストークンを書いたファイル（キーチェーンの無い Linux の VM など向け。任意）
# 探す順番は 環境変数 BWS_ACCESS_TOKEN → このファイル → macOS キーチェーン
# ファイルはリポジトリの外に置き、本人だけが読める権限（chmod 600）にする
token_file = ""

[credentials.bitwarden.secret_ids]
# Bitwarden Secrets Manager の各シークレットの ID（UUID）。ID 自体は秘密ではないのでここに書いてよい
inet_id = "148a4ac6-6a41-4971-a13e-b4f400edaf37"
subscriber_number = "2ac0798b-aa14-4132-ad53-b4f400ec5791"
pin = "30bb329a-6f4b-4ec1-891f-b4f400ec78ec"
pars_number = "764cbdd3-3583-4d5f-b932-b4f400ecd885"

[db]
# config.toml からの相対パス
path = "db.sqlite"
