# keiba-mcp 固定設定
# ここの値は MCP ツールからは読み取りも変更もできない。変更は人間がこのファイルを直接編集する。

[guard]
# 1レースあたりの上限額（円）
per_race_limit = 500
# 1週間（火曜〜翌月曜。土日と祝日の月曜開催を同じ週に含める）あたりの上限額（円）
weekly_limit = 1000
# 損失（投票額合計 − 払戻合計。未確定の投票は全額損失とみなす）がこの額に達したら自動停止（円）
# 一度停止すると、人間が補充（uv run admin.py resume）するまで全ての投票を拒否する
# 補充すると、その時点の損失を基準にして、以後の損失をこの額と比べる
loss_stop_threshold = 3000
# 投票金額の単位（円）
bet_unit = 100
# 投票を許可するレース番号（11 = メインレース）。空にすると全レース許可
allowed_race_numbers = [11]

[data]
# データ取得元: "jra"（JRA 公式サイト）または "dummy"（ダミーデータ）
source = "jra"

[data.jra]
# リクエストの最小間隔（秒）。取得元に負荷をかけないため 1 秒未満は不可
request_interval_sec = 3
# 取得したページのキャッシュ（config.toml からの相対パス）
cache_path = "cache.sqlite"
user_agent = "keiba-mcp (personal use)"

[data.dummy]
# false: 実データと同じく、発走10分後まで結果は未確定（発走前に結果を見てから投票することはできない）
# true: 発走前でも結果を返す（動作確認用。結果を見てから投票できてしまうので通常は使わない）
instant_results = false

[voter]
# 投票方式: "dry_run"（記録だけ）。"browser" はスタブで、使用不可
mode = "dry_run"

[db]
# config.toml からの相対パス
path = "db.sqlite"
