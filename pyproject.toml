[project]
name = "keiba-mcp"
version = "0.1.0"
description = "競馬の買い目をAIが決めて投票までつなぐ MCP サーバ（既定はドライラン）"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "playwright>=1.64.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
