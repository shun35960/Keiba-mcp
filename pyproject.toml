[project]
name = "keiba-mcp"
version = "0.1.0"
description = "競馬の買い目をAIが決めて投票までつなぐ MCP サーバ（開発中はドライランのみ）"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
